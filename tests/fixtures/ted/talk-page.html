<html><head><title>x</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"videoData": {"slug": "paul_bloom_ai_and_the_end_of_loneliness", "title": "AI and the end of loneliness", "presenterDisplayName": "Paul Bloom", "publishedAt": "2026-09-30T14:37:29Z", "duration": 737, "hlsUrl": "https://hls.ted.com/project_masters/12009/manifest.m3u8?intro_master_id=9294", "primaryImageSet": [{"url": "https://pi.tedcdn.com/r/talkstar-assets.s3.amazonaws.com/production/talks/talk_188342/99f35476-b282-4123-a02e-23ec86ee68b2/PaulBloom_2026-embed.jpg", "aspectRatioName": "16x9"}, {"url": "https://pi.tedcdn.com/r/talkstar-assets.s3.amazonaws.com/production/talks/talk_188342/eb12f891-307e-4d95-a708-0a0a6cea674d/PaulBloom_2026-stageshot.jpg", "aspectRatioName": "4x3"}, {"url": "https://pi.tedcdn.com/r/talkstar-assets.s3.amazonaws.com/production/talks/talk_188342/4d66d508-9971-428c-9320-e40e47f1f310/PaulBloom_2026-1350x675.jpg", "aspectRatioName": "2x1"}], "topics": {"nodes": [{"name": "AI"}, {"name": "technology"}, {"name": "relationships"}, {"name": "emotions"}, {"name": "personal growth"}, {"name": "culture"}, {"name": "society"}, {"name": "psychology"}]}}, "transcriptData": {"translation": {"paragraphs": [{"cues": [{"text": "I have a couple of questions for you --\nbut they’re personal.", "time": 697}, {"text": "So I’m not going to ask\nfor a show of hands.", "time": 3800}, {"text": "First, right now,\nat this stage of your life,", "time": 6537}, {"text": "are you lonely?", "time": 10541}]}, {"cues": [{"text": "My favorite description of loneliness", "time": 16213}, {"text": "comes from Zoë Heller's book\n\"Notes on a Scandal.\"", "time": 18582}, {"text": "And in it, the narrator,\nwho is played in the movie by Judi Dench,", "time": 22219}, {"text": "distinguishes between passing loneliness\nand something deeper.", "time": 27090}]}, {"cues": [{"text": "I like this quote for a few reasons.", "time": 71034}, {"text": "It talks about solitude,", "time": 73570}, {"text": "and solitude is\na big source of loneliness,", "time": 74905}, {"text": "but it also talks about love.", "time": 77741}]}]}}}}}</script></body></html>
